
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile - Project Atlas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .profile-card {
            background-color: white;
            width: 350px;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1e3a8a;
        }

        h3 {
            color: #555;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .skills {
            margin: 20px 0;
        }

        .skills span {
            display: inline-block;
            background-color: #dbeafe;
            color: #1e40af;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 20px;
        }

        .profile-link {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <section class="profile-card">

        <h1>Harsha D.</h1>

        <h3>First Year BTech CSE Student</h3>

        <p>
            I am a computer science student interested in
            web development and programming. I enjoy learning
            new technologies and building useful projects.
        </p>

        <h3>My Skills</h3>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Python</span>
        </div>

        <a href="https://github.com/" 
           class="profile-link"
           aria-label="Visit Harsha D.'s GitHub portfolio"
           target="_blank"
           rel="noopener noreferrer">
            Visit My GitHub
        </a>

    </section>

</body>
</html>
